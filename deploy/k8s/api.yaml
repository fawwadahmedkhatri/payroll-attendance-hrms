apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: hrms
spec:
  # Keep 1 replica: the hourly attendance job runs inside the API process
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: payroll-hrms-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: NODE_ENV
              value: production
            - name: SEED_ON_START
              value: "false"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: hrms-secrets, key: DATABASE_URL }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: hrms-secrets, key: JWT_SECRET }
          readinessProbe:
            httpGet: { path: /api/health, port: 4000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 4000 }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: hrms
spec:
  selector:
    app: api
  ports:
    - port: 4000
      targetPort: 4000
