# Optional: requires an ingress controller (e.g. ingress-nginx). Add "hrms.local" to your hosts file.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hrms
  namespace: hrms
spec:
  rules:
    - host: hrms.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
