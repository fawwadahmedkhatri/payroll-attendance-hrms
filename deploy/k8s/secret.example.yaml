# Copy to secret.yaml, replace the placeholder values, then `kubectl apply -f secret.yaml`.
# Never commit real secrets. Generate a JWT secret with: openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: hrms-secrets
  namespace: hrms
type: Opaque
stringData:
  POSTGRES_PASSWORD: CHANGE_ME_DB_PASSWORD
  JWT_SECRET: CHANGE_ME_LONG_RANDOM_STRING
  DATABASE_URL: postgresql://hrms:CHANGE_ME_DB_PASSWORD@postgres:5432/hrms?schema=public
