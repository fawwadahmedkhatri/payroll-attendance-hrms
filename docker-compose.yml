name: payroll-hrms

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hrms_local_pw}
      POSTGRES_DB: hrms
    ports:
      # Host port 5433 avoids clashing with a locally installed PostgreSQL on 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrms -d hrms"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hrms:${POSTGRES_PASSWORD:-hrms_local_pw}@db:5432/hrms?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please}
      PORT: 4000
      NODE_ENV: production
      # Set to "true" on first start to load ~500 sample employees
      SEED_ON_START: ${SEED_ON_START:-false}
    ports:
      - "4000:4000"

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: http://api:4000
    ports:
      - "3000:3000"

volumes:
  pgdata:
